# 悬浮供电配置
# 改完不用重启：daemon 每个采样周期都会重读本文件

# 总开关 0=关 1=开（也可以在 Magisk App 点模块「操作」按钮切换）
ENABLED=0

# 一个完整周期多少秒。周期内采 SAMPLE_COUNT 次，算 1 次平均值、写 1 次电流
# 例：60 → 每 12 秒采 1 次，采满 5 次写 1 次
SAMPLE_WINDOW=60

# 每周期采样次数
SAMPLE_COUNT=5

# 死区（mA）：平均净电流绝对值小于它就不调整，避免来回抖
DEADBAND_MA=50

# 每次调整的步长（mA）：净电流在死区与 BIG_MA 之间时，一次挪这么多
STEP_MA=30

# 偏离阈值（mA）：平均净电流绝对值超过它，就不按步长挪，
# 直接按差值一步到位（净电流≈流入-系统功耗，砍掉差值基本就落到 0）
BIG_MA=100

# 正常充电时的电流上限（mA）：实测原厂 SIC-BAT 正常温度档是 22000，
# 写这个才等于"不限流"。不要写 9999999，那是超范围值，驱动行为不可控
NORMAL_CM_MA=22000

# 首次进入时的起始限流（mA）：实测平板平衡点在 60~270 之间，
# 从 100 起步低负载基本一轮到位；必须高于 ~40（低于会被驱动忽略）
INIT_CM_MA=100

# 单次最大调整幅度（mA）：大步逼近时也不能一次挪太多，
# 否则充电电流的惯性会让它在上下限之间反复震荡
MAX_ADJ_MA=800

# 电流钳位下限（mA）：实测临界点就在 50——
#   低于 50  → 驱动关闭充电，电池开始放电（掉电），设多少都一样
#   50~60    → 最小充电档，稳定在 30~40mA，不随设定值变化
#   ≥100     → 线性可控，净电流 ≈ -(CM - 27)
# 允许设更低，但低于 50 等于"停止充电"，会掉电
MIN_CM_MA=50

# 电流钳位上限（mA）：防止反馈把电流推高导致充过头
MAX_CM_MA=500

# 电量保护：达到这个百分比就停止悬浮供电（保持正常充电或断充交给系统）
BATT_MAX=95

# 电量下限保护：低于它不启用（避免低电量时还用伪旁路）
BATT_MIN=20

# 日志最大行数
LOG_MAX_LINES=400
