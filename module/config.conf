# 悬浮供电配置
# 改完不用重启：daemon 每个采样周期都会重读本文件

# 总开关 0=关 1=开（也可以在 Magisk App 点模块「操作」按钮切换）
ENABLED=0

# 一个完整周期多少秒。周期内采 SAMPLE_COUNT 次，算 1 次平均值、写 1 次电流
# 例：60 → 每 12 秒采 1 次，采满 5 次写 1 次
SAMPLE_WINDOW=60

# 每周期采样次数
SAMPLE_COUNT=5

# 死区（mA）：平均净电流绝对值小于它就不调整，避免来回抖
DEADBAND_MA=50

# 每次调整的步长（mA）
STEP_MA=30

# 电流钳位下限（mA）：低于这个值驱动会放弃充电（滑入断充），必须留余量
MIN_CM_MA=50

# 电流钳位上限（mA）：防止反馈把电流推高导致充过头
MAX_CM_MA=500

# 电量保护：达到这个百分比就停止悬浮供电（保持正常充电或断充交给系统）
BATT_MAX=95

# 电量下限保护：低于它不启用（避免低电量时还用伪旁路）
BATT_MIN=20

# 日志最大行数
LOG_MAX_LINES=400
